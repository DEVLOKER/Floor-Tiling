# ── Floor Tiling Visualizer — DEV override (no baked models, local folder) ───
# Overrides docker-compose.yml: pulls/builds a lean image (WITH_MODELS=false).
# On first start the app downloads the chosen profile's weights into
# ./client/models (bind-mounted at /app/models) and reuses them on later runs.
# Models stay visible on the host alongside the source code.
#
# ── Variables ────────────────────────────────────────────────────────────────
#   DETECTION_PROFILE   Model profile resolved at RUNTIME — change and restart,
#                       no rebuild needed (default: fast)
#                         fast      — tiny/slim models, quickest startup
#                         balanced  — mid sizes, good speed/quality trade-off
#                         quality   — largest models, best masks (slowest)
#                         custom    — use per-model *_VARIANT env vars below
#
#   PLATFORM     Platform slug for the pulled image (default: linux-amd64)
#                         linux-amd64   — x86_64 hosts
#                         linux-arm64   — ARM64 hosts
#
# ── Pull pre-built nomodels image and run (downloads weights on first start) ──
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
#   # arm64 host, balanced profile:
#   PLATFORM=linux-arm64 DETECTION_PROFILE=balanced \
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# ── Build lean image locally and run ─────────────────────────────────────────
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
#   # Switch profile without rebuilding (weights re-downloaded if not cached):
#   DETECTION_PROFILE=quality \
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#

services:
  floortiling:
    # Distinct image so this never overwrites the baked image from docker-compose.yml.
    # Matches the CI DockerHub tag: berghout/floor-tiling:nomodels-<platform>-<version>.
    image: "docker.io/berghout/floor-tiling:nomodels-${PLATFORM:-linux-amd64}-${VERSION:-latest}"
    build:
      args:
        WITH_MODELS: "false"
        DETECTION_PROFILE: "${DETECTION_PROFILE:-fast}"
        # Online at runtime so the app can download into the volume.
        HF_HUB_OFFLINE: "0"
    ports:
      - "8000:8000"
    environment:
      # ── Profile — sets all model sizes at once (no rebuild needed) ────────
      #   "fast"     — tiny/slim models, quickest startup
      #                (mask2former=tiny, oneformer=tiny, depth=small,
      #                 yolo=s, dino=tiny, sam=slim50, vitmatte=small)
      #   "balanced" — mid sizes, good speed/quality trade-off
      #                (mask2former=base, oneformer=tiny, depth=base,
      #                 yolo=m, dino=tiny, sam=slim77, vitmatte=small)
      #   "quality"  — largest models, best masks (slowest)
      #                (mask2former=large, oneformer=large, depth=large,
      #                 yolo=x, dino=base, sam=base, vitmatte=base)
      #   "custom"   — ignore profile, use the per-model *_VARIANT vars below
      DETECTION_PROFILE: "${DETECTION_PROFILE:-fast}"
      # ── Per-model overrides — win over the profile; mix-and-match freely ──
      # MASK2FORMER_VARIANT: "tiny"      # "tiny" | "small" | "base" | "large"
      # ONEFORMER_VARIANT: "tiny"        # "tiny" | "large" | "dinat_large"  (dinat needs `natten`)
      # DEPTH_VARIANT: "small"           # "small" | "base" | "large"
      # YOLO_WORLD_VARIANT: "s"          # "s" | "m" | "l" | "x"  (x≈140 MB best recall, s≈25 MB fastest)
      # GROUNDING_DINO_VARIANT: "tiny"   # "tiny" | "base"
      # SAM_VARIANT: "slim50"            # "slim50" | "slim77" | "base" | "large" | "huge"
      # VITMATTE_VARIANT: "small"        # "small" | "base"
      # Must stay 0 so runtime downloads into ./client/models are allowed.
      HF_HUB_OFFLINE: "0"
      MODELS_DIR: /app/models
    volumes:
      - ./client/models:/app/models
