# ── Floor Tiling Visualizer — DEV override (download-once cache volume) ──────
# Builds a lean image with NO weights baked in; on first start the app downloads
# the models into a writable named volume (`model-cache`) and reuses them after.
# For development only — the customer image (docker-compose.yml) bakes weights so
# it never needs the network.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#       first run needs internet (~2.1 GB); later runs hit the cache offline.

services:
  floortiling:
    # Distinct image name so the slim/volume build doesn't overwrite the baked
    # customer image (floortiling:latest from docker-compose.yml).
    image: floortiling:slim
    build:
      args:
        MODEL_SOURCE: volume
    environment:
      # Point the model managers at the mounted cache volume.
      MASK2FORMER_DIR: /models/mask2former
      ONEFORMER_DIR: /models/oneformer
      DEPTH_DIR: /models/depth
    volumes:
      - model-cache:/models

volumes:
  model-cache:
