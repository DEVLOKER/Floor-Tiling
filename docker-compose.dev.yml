# ── Floor Tiling Visualizer — DEV / lean override (local models folder) ──────
# Builds a lean image with NO weights baked in (WITH_MODELS=false). On first
# start the app downloads the models — for the chosen DETECTION_PROFILE — into
# ./client/models (bind-mounted at MODELS_DIR=/app/models) and reuses them on
# later runs. Models stay visible on the host alongside the source code.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#       first run needs internet; later runs reuse the local folder.
#
# Switch profile/sizes at RUNTIME with env (no rebuild) — e.g. set
# DETECTION_PROFILE=balanced below, or any *_VARIANT.

services:
  floortiling:
    # Distinct image name (-nomodels suffix) so the volume build never overwrites
    # the baked image from docker-compose.yml. Matches the CI tagging scheme:
    # berghout/floor-tiling:nomodels-latest-<platform>.
    image: "docker.io/berghout/floor-tiling:nomodels-latest-${PLATFORM_SUFFIX:-linux-amd64}"
    build:
      args:
        WITH_MODELS: "false"
        DETECTION_PROFILE: "${DETECTION_PROFILE:-fast}"
        # Online at runtime so the app can download into the volume.
        HF_HUB_OFFLINE: "0"
    ports:
      - "8000:8000"
    environment:
      # ── Profile — sets all model sizes at once (no rebuild needed) ────────
      #   "fast"     — tiny/slim models, quickest startup
      #                (mask2former=tiny, oneformer=tiny, depth=small,
      #                 yolo=s, dino=tiny, sam=slim50, vitmatte=small)
      #   "balanced" — mid sizes, good speed/quality trade-off
      #                (mask2former=base, oneformer=tiny, depth=base,
      #                 yolo=m, dino=tiny, sam=slim77, vitmatte=small)
      #   "quality"  — largest models, best masks (slowest)
      #                (mask2former=large, oneformer=large, depth=large,
      #                 yolo=x, dino=base, sam=base, vitmatte=base)
      #   "custom"   — ignore profile, use the per-model *_VARIANT vars below
      DETECTION_PROFILE: "${DETECTION_PROFILE:-fast}"
      # ── Per-model overrides — win over the profile; mix-and-match freely ──
      # MASK2FORMER_VARIANT: "tiny"      # "tiny" | "small" | "base" | "large"
      # ONEFORMER_VARIANT: "tiny"        # "tiny" | "large" | "dinat_large"  (dinat needs `natten`)
      # DEPTH_VARIANT: "small"           # "small" | "base" | "large"
      # YOLO_WORLD_VARIANT: "s"          # "s" | "m" | "l" | "x"  (x≈140 MB best recall, s≈25 MB fastest)
      # GROUNDING_DINO_VARIANT: "tiny"   # "tiny" | "base"
      # SAM_VARIANT: "slim50"            # "slim50" | "slim77" | "base" | "large" | "huge"
      # VITMATTE_VARIANT: "small"        # "small" | "base"
      # Must stay 0 so runtime downloads into ./client/models are allowed.
      HF_HUB_OFFLINE: "0"
      MODELS_DIR: /app/models
    volumes:
      - ./client/models:/app/models
