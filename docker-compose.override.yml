# ── Development overrides ────────────────────────────────────────────────────
# Automatically merged by `docker compose up` when this file is present.
# DO NOT commit secrets to this file.
#
# What this adds over docker-compose.yml:
#   • Bind-mounts source code → instant reload without rebuilding the image.
#   • Enables uvicorn --reload (watches .py files inside the container).
#   • Sets debug log level.

services:
  app:
    # Override the production CMD with hot-reload enabled
    command:
      - uvicorn
      - "server:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--reload"
      - "--reload-dir"
      - "/app"
      - "--log-level"
      - "debug"
      - "--h11-max-incomplete-event-size"
      - "104857600"

    environment:
      APP_LOG_LEVEL: "debug"

    # Mount source directories so edits on the host are reflected immediately.
    # Models directory is read-only (never edited during dev).
    volumes:
      - ./server.py:/app/server.py
      - ./config:/app/config
      - ./core:/app/core
      - ./ml_models:/app/ml_models
      - ./patterns:/app/patterns
      - ./processors:/app/processors
      - ./static:/app/static
      - ./sam2/models:/app/sam2/models:ro

    # Relax resource limits for development
    deploy:
      resources:
        limits:
          memory: 6G
