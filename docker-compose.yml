# ── Floor Tiling Visualizer — CUSTOMER deployment (offline, weights baked) ──
# This is the production/customer path: the image is built with MODEL_SOURCE=local
# so all three models are baked in and the container runs FULLY OFFLINE — no
# volume, no network, ever.
#
#   docker compose build      # needs the weights present in client/models/<name>/
#   docker compose up         # runs offline
#
# Build the weights into the context first (run the app once, or copy in the
# model.safetensors files under client/models/{mask2former,oneformer,depth}/).
# Deliver the result with `docker save floortiling:latest | gzip > app.tar.gz`.
#
# For local/internal development that downloads weights once into a cache volume
# instead of baking them, use the dev override:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  floortiling:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODEL_SOURCE: local
    image: floortiling:latest
    ports:
      - "8000:8000"
    # The license file is read from a mounted path at runtime. Point this at the
    # customer's USB / license directory (read-only).
    # volumes:
    #   - "D:/license:/license:ro"
    restart: unless-stopped
