# ── Floor Tiling Visualizer — volume deployment ──────────────────────────
# Builds a lean image with NO model weights baked in. On first start the app
# downloads the segmentation + depth models into a writable named volume
# (`model-cache`); subsequent starts reuse them with no network.
#
#   docker compose up --build        # first run needs internet (downloads ~2.1 GB)
#   docker compose up                # later runs are offline (cache hit)
#
# To pre-seed the cache offline instead, copy the three model folders into the
# `model-cache` volume before first start (config + weights under
# /models/mask2former, /models/oneformer and /models/depth).

services:
  floortiling:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODEL_SOURCE: volume
    image: floortiling:latest
    ports:
      - "8000:8000"
    environment:
      # Point the model managers at the mounted cache volume.
      # (These are the only env vars the app actually reads — host/port/workers
      # are hardcoded in the Dockerfile CMD, so there's nothing else to set.)
      MASK2FORMER_DIR: /models/mask2former
      ONEFORMER_DIR: /models/oneformer
      DEPTH_DIR: /models/depth
    volumes:
      - model-cache:/models
    restart: unless-stopped

volumes:
  model-cache:
