# ── Floor Tile Visualizer — Docker Compose ──────────────────────────────────
# Production stack.
# Dev overrides are in docker-compose.override.yml (auto-loaded by Compose).
#
# Quick start:
#   docker compose up --build          # production
#   docker compose up --build          # dev (override is applied automatically)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # image: floor-tile-visualizer:latest
    image: docker push berghout/ceramic:latest
    container_name: floor-tile-visualizer

    # ── Port mapping ─────────────────────────────────────────────────────────
    ports:
      - "${APP_PORT:-8000}:8000"

    # ── Environment ──────────────────────────────────────────────────────────
    environment:
      PYTHONUNBUFFERED: "1"
      # Set to "cuda" in a GPU host and use the nvidia runtime below
      APP_DEVICE: "${APP_DEVICE:-cpu}"
      APP_LOG_LEVEL: "${APP_LOG_LEVEL:-info}"

    # ── Model volume ─────────────────────────────────────────────────────────
    # Models are baked into the image by default (see .dockerignore).
    # To share a pre-downloaded model directory instead (keeps image smaller):
    #
    #   1. Uncomment the volume lines below.
    #   2. Add `sam2/models/*.pt` to .dockerignore.
    #   3. Ensure ./sam2/models contains the .pt files on the host.
    #
    # volumes:
    #   - ./sam2/models:/app/sam2/models:ro

    # ── Health check (also in Dockerfile; Compose shows it in `ps`) ──────────
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

    # ── Restart policy ───────────────────────────────────────────────────────
    restart: unless-stopped

    # ── Resource limits (adjust to your host) ────────────────────────────────
    deploy:
      resources:
        limits:
          memory: 4G        # SAM2 tiny on CPU needs ~1.5 GB; headroom for requests
        reservations:
          memory: 1G

    # ── Logging ──────────────────────────────────────────────────────────────
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # ── Labels ───────────────────────────────────────────────────────────────
    labels:
      com.floortile.service: "api"
      com.floortile.version: "1.0.0"

# ── GPU profile (opt-in) ─────────────────────────────────────────────────────
# Run with:  docker compose --profile gpu up
# Requires nvidia-container-toolkit installed on the host.
#
#   profiles: [gpu]
#   deploy:
#     resources:
#       reservations:
#         devices:
#           - driver: nvidia
#             count: 1
#             capabilities: [gpu]
