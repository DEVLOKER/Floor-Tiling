name: Build & Push Docker Image

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Model profile (fast | balanced | quality | custom)"
        required: false
        default: "fast"
        type: choice
        options: ["fast", "balanced", "quality", "custom"]
      variant:
        description: "Which image(s) to build"
        required: false
        default: "nomodels"
        type: choice
        options: ["nomodels", "baked", "both"]
      version:
        description: "Optional version appended to the tag, e.g. -v1.2.0 (include your own separator). Empty = profile tag only."
        required: false
        default: ""
        type: string
      platforms:
        description: "Comma‑separated list of platforms to build, e.g. linux/amd64,linux/arm64"
        required: false
        default: "linux/amd64"
        type: string
      push_ghcr:
        description: "Push to GHCR (ghcr.io)"
        required: false
        default: true
        type: boolean
      push_dockerhub:
        description: "Push to DockerHub (needs DOCKERHUB_USERNAME/TOKEN secrets)"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v*"

concurrency:
  group: docker-${{ github.ref }}-${{ github.event.inputs.profile || 'fast' }}-${{ github.event.inputs.platforms || 'linux/amd64' }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        env:
          VARIANT: ${{ github.event.inputs.variant || 'both' }}
          PLATFORMS_INPUT: ${{ github.event.inputs.platforms || 'linux/amd64' }}
        run: |
          # --- prepare variant objects (unchanged) ---
          baked='{"variant":"baked","with_models":"true","hf_offline":"1","suffix":""}'
          nomodels='{"variant":"nomodels","with_models":"false","hf_offline":"0","suffix":"-nomodels"}'
          case "$VARIANT" in
            baked)    include_variants="[$baked]" ;;
            nomodels) include_variants="[$nomodels]" ;;
            *)        include_variants="[$baked,$nomodels]" ;;
          esac

          # --- parse platforms ---
          IFS=',' read -ra PLATFORMS <<< "$PLATFORMS_INPUT"
          PLATFORM_COUNT=${#PLATFORMS[@]}

          # --- generate combined matrix entries ---
          entries="[]"
          for variant_json in $(echo "$include_variants" | jq -c '.[]'); do
            for plat in "${PLATFORMS[@]}"; do
              plat_clean=$(echo "$plat" | xargs)   # trim whitespace
              # platform tag suffix: only add if >1 platform
              if [ "$PLATFORM_COUNT" -gt 1 ]; then
                plat_suffix="-${plat_clean//\//-}"   # e.g. linux/amd64 -> -linux-amd64
              else
                plat_suffix=""
              fi
              entry=$(echo "$variant_json" | jq -c \
                --arg plat "$plat_clean" \
                --arg plat_sfx "$plat_suffix" \
                '. + {platform: $plat, platform_suffix: $plat_sfx}')
              entries=$(echo "$entries" | jq -c ". + [$entry]")
            done
          done
          echo "matrix={\"include\":$entries}" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: setup
    name: Build & Push (${{ matrix.variant }} / ${{ matrix.platform }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PROFILE: ${{ github.event.inputs.profile || 'fast' }}
      PUSH_GHCR: ${{ github.event.inputs.push_ghcr != 'false' }}
      PUSH_DH: ${{ github.event.inputs.push_dockerhub != 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Free disk only for baked images (unchanged)
      - name: Free disk space
        if: ${{ matrix.with_models == 'true' }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # Set up QEMU for cross‑platform building (needed when building arm64 on amd64 runner)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Resolve image tags
        id: meta
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          PROFILE: ${{ env.PROFILE }}
          SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ github.event.inputs.version }}
          PLATFORM_SUFFIX: ${{ matrix.platform_suffix }}
        run: |
          ghcr="ghcr.io/${GITHUB_REPOSITORY,,}"
          ghcr_on=false; dh_on=false
          # baked includes profile in tag (e.g. fast-latest); nomodels does not (nomodels-latest)
          if [ "$VARIANT" = "nomodels" ]; then
            tag_prefix="${SUFFIX#-}"   # strip leading dash → "nomodels"
          else
            tag_prefix="${PROFILE}${SUFFIX}"
          fi
          {
            echo "tags<<EOF"
            if [ "$PUSH_GHCR" = "true" ]; then
              echo "${ghcr}:${PROFILE}${SUFFIX}${VERSION}${PLATFORM_SUFFIX}"
              echo "${ghcr}:${PROFILE}${SUFFIX}-latest${PLATFORM_SUFFIX}"
              ghcr_on=true
            fi
            if [ "$PUSH_DH" = "true" ] && [ -n "$DH_USER" ]; then
              echo "docker.io/${DH_USER}/floor-tiling:${PROFILE}${SUFFIX}${VERSION}${PLATFORM_SUFFIX}"
              echo "docker.io/${DH_USER}/floor-tiling:${PROFILE}${SUFFIX}-latest${PLATFORM_SUFFIX}"
              dh_on=true
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "ghcr=$ghcr_on"
            echo "dh=$dh_on"
            if [ "$ghcr_on" = "true" ] || [ "$dh_on" = "true" ]; then echo "do_push=true"; else echo "do_push=false"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ steps.meta.outputs.ghcr == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        if: ${{ steps.meta.outputs.dh == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (${{ matrix.variant }}, ${{ matrix.platform }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.meta.outputs.do_push == 'true' }}
          platforms: ${{ matrix.platform }}
          build-args: |
            WITH_MODELS=${{ matrix.with_models }}
            DETECTION_PROFILE=${{ env.PROFILE }}
            HF_HUB_OFFLINE=${{ matrix.hf_offline }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ env.PROFILE }}-${{ matrix.variant }}-${{ matrix.platform_suffix }}
          cache-to: type=gha,mode=max,scope=${{ env.PROFILE }}-${{ matrix.variant }}-${{ matrix.platform_suffix }}
