name: Build & Push Docker Image

# Builds the Docker image(s) for a DETECTION_PROFILE (default: fast) and pushes
# them to GitHub Container Registry (ghcr.io). No extra secrets needed — the
# built-in GITHUB_TOKEN authenticates the push.
#
# Two variants (select with the "variant" input; both on tag builds):
#   • baked     → models baked in, offline runtime   → tag  :<profile>
#   • nomodels  → no weights; downloaded at runtime  → tag  :<profile>-nomodels
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Model profile (fast | balanced | quality | custom)"
        required: false
        default: "fast"
        type: choice
        options: ["fast", "balanced", "quality", "custom"]
      variant:
        description: "Which image(s) to build"
        required: false
        default: "nomodels"
        type: choice
        options: ["nomodels", "baked", "both"]
      push_ghcr:
        description: "Push to GHCR (ghcr.io)"
        required: false
        default: true
        type: boolean
      push_dockerhub:
        description: "Push to DockerHub (needs DOCKERHUB_USERNAME/TOKEN secrets)"
        required: false
        default: true
        type: boolean
  # Build on release tags too (e.g. v1.2.3) — builds both variants.
  push:
    tags:
      - "v*"

concurrency:
  group: docker-${{ github.ref }}-${{ github.event.inputs.profile || 'fast' }}
  cancel-in-progress: true

jobs:
  # Compute the matrix so only the requested variant(s) become build legs.
  # (A job-level `if` can't read the matrix context, so we filter here instead.)
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        env:
          VARIANT: ${{ github.event.inputs.variant || 'both' }}
        run: |
          baked='{"variant":"baked","with_models":"true","hf_offline":"1","suffix":""}'
          nomodels='{"variant":"nomodels","with_models":"false","hf_offline":"0","suffix":"-nomodels"}'
          case "$VARIANT" in
            baked)    include="[$baked]" ;;
            nomodels) include="[$nomodels]" ;;
            *)        include="[$baked,$nomodels]" ;;
          esac
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: setup
    name: Build & Push (${{ matrix.variant }} / ${{ github.event.inputs.profile || 'fast' }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PROFILE: ${{ github.event.inputs.profile || 'fast' }}
      # Each registry has its own toggle. Default on (also for the tag trigger,
      # where inputs are empty → '' != 'false' is true).
      PUSH_GHCR: ${{ github.event.inputs.push_ghcr != 'false' }}
      PUSH_DH: ${{ github.event.inputs.push_dockerhub != 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Only the baked image is huge (torch + weights); reclaim runner space the
      # hosted image wastes on unused toolchains before building it.
      - name: Free disk space
        if: ${{ matrix.with_models == 'true' }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # Build the tag list per the toggles. GHCR tags only when push_ghcr is on;
      # DockerHub tags only when push_dockerhub is on AND DOCKERHUB_USERNAME is
      # set (so the run never fails just because the DockerHub secrets are absent).
      - name: Resolve image tags
        id: meta
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          PROFILE: ${{ env.PROFILE }}
          SUFFIX: ${{ matrix.suffix }}
          SHA: ${{ github.sha }}
        run: |
          ghcr="ghcr.io/${GITHUB_REPOSITORY,,}"   # GHCR requires lowercase
          ghcr_on=false; dh_on=false
          {
            echo "tags<<EOF"
            if [ "$PUSH_GHCR" = "true" ]; then
              echo "${ghcr}:${PROFILE}${SUFFIX}"
              echo "${ghcr}:${PROFILE}${SUFFIX}-${SHA}"
              ghcr_on=true
            fi
            if [ "$PUSH_DH" = "true" ] && [ -n "$DH_USER" ]; then
              echo "docker.io/${DH_USER}/floor-tiling:${PROFILE}${SUFFIX}"
              echo "docker.io/${DH_USER}/floor-tiling:${PROFILE}${SUFFIX}-${SHA}"
              dh_on=true
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "ghcr=$ghcr_on"
            echo "dh=$dh_on"
            if [ "$ghcr_on" = "true" ] || [ "$dh_on" = "true" ]; then echo "do_push=true"; else echo "do_push=false"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ steps.meta.outputs.ghcr == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        if: ${{ steps.meta.outputs.dh == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (${{ matrix.variant }}, profile=${{ env.PROFILE }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.meta.outputs.do_push == 'true' }}
          # amd64 only: an emulated arm64 build would download torch (+ models for
          # the baked variant) under QEMU and is impractically slow / disk-heavy.
          platforms: linux/amd64
          build-args: |
            WITH_MODELS=${{ matrix.with_models }}
            DETECTION_PROFILE=${{ env.PROFILE }}
            HF_HUB_OFFLINE=${{ matrix.hf_offline }}
          # Pushed to GHCR + (when configured) DockerHub.
          tags: ${{ steps.meta.outputs.tags }}
          # Per-variant+profile cache scope so builds don't clobber each other.
          cache-from: type=gha,scope=${{ env.PROFILE }}-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ env.PROFILE }}-${{ matrix.variant }}
